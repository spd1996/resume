<style>
  /* Layout: full-bleed 3D circuit board (black solder mask, gold traces). Each resume section is a chip.
     Overlay: name block top-left, reading panel on the right (bottom sheet on phones), chip selector along the bottom.
     Single committed dark look. */
  :root {
    --bg: #07090b;
    --panel: rgba(13, 16, 20, 0.84);
    --line: rgba(230, 178, 90, 0.2);
    --fg: #ede8de;
    --soft: #aaa59c;
    --faint: #706b63;
    --gold: #e6b25a;
    --gold-deep: #2b2115;
    --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; overflow: hidden; }
  * { box-sizing: border-box; }
  #board { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  a { color: inherit; text-decoration-color: var(--gold); text-underline-offset: 3px; }
  a:hover { color: var(--gold); }
  button { font: inherit; color: inherit; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* name block */
  .brand { position: fixed; top: calc(20px + env(safe-area-inset-top, 0px)); left: 24px; max-width: min(460px, calc(100% - 48px)); pointer-events: none; }
  .brand .tag { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
  .brand h1 { font-family: var(--display); font-stretch: 125%; font-weight: 800; font-size: clamp(1.8rem, 4.2vw, 3.2rem); line-height: 0.95; letter-spacing: -0.02em; margin: 6px 0 6px; text-wrap: balance; text-shadow: 0 2px 24px rgba(0,0,0,.6); }
  .brand p { margin: 0; color: var(--soft); font-family: var(--display); font-weight: 500; }
  .brand .hint { font-family: var(--mono); font-size: 0.68rem; color: var(--faint); margin-top: 10px; }

  /* reading panel */
  .panel {
    position: fixed; top: calc(20px + env(safe-area-inset-top, 0px)); right: 20px; bottom: 84px; width: 390px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    display: grid; grid-template-rows: 1fr auto; overflow: hidden;
  }
  .panel-body { overflow-y: auto; padding: 24px 24px 20px; min-height: 0; }
  .panel-foot { display: flex; justify-content: space-between; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .step { background: none; border: 0; cursor: pointer; font-family: var(--mono); font-size: 0.72rem; color: var(--soft); padding: 6px 8px; border-radius: 4px; }
  .step:hover { color: var(--gold); }
  .eyebrow { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); display: flex; gap: 10px; align-items: center; }
  .eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .panel h2 { font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: 1.75rem; line-height: 1.05; margin: 10px 0 14px; letter-spacing: -0.01em; text-wrap: balance; }
  .panel h3 { font-family: var(--display); font-stretch: 105%; font-weight: 700; font-size: 1.02rem; margin: 0; }
  .panel p { margin: 0 0 12px; }
  .muted { color: var(--soft); }
  .mono { font-family: var(--mono); font-size: 0.76rem; color: var(--soft); font-variant-numeric: tabular-nums; }

  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0; }
  .fact { border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
  .fact strong { display: block; font-family: var(--display); font-stretch: 85%; font-weight: 800; font-size: 1.6rem; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
  .fact span { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
  .cta { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { display: inline-block; font-family: var(--mono); font-size: 0.74rem; text-decoration: none; padding: 7px 12px; border-radius: 5px; border: 1px solid var(--line); background: transparent; cursor: pointer; white-space: nowrap; }
  .btn.solid { background: var(--gold); color: #120d05; border-color: var(--gold); }
  .btn:hover { border-color: var(--gold); color: var(--gold); }
  .btn.solid:hover { background: #f2c87d; color: #120d05; }

  .list { list-style: none; margin: 0; padding: 0; display: grid; }
  .list > li { padding: 14px 0; border-top: 1px solid var(--line); display: grid; gap: 3px; }
  .list > li:first-child { border-top: 0; padding-top: 4px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .now { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: #120d05; background: var(--gold); padding: 1px 6px; border-radius: 3px; margin-left: 6px; vertical-align: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 0.82rem; padding: 3px 10px; border-radius: 4px; border: 1px solid var(--line); }
  .chip.core { background: var(--gold-deep); border-color: var(--gold); }
  .group + .group { margin-top: 16px; }
  .k { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
  .rank { display: grid; grid-template-columns: 4.2ch 1fr; gap: 14px; align-items: baseline; }
  .rank b.n { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 1.7rem; color: var(--gold); text-align: right; line-height: 1; font-variant-numeric: tabular-nums; }
  .rank b.n.w { font-size: 1.05rem; font-stretch: 100%; }
  .contact li { grid-template-columns: 74px 1fr; display: grid; align-items: baseline; }
  .v { user-select: all; overflow-wrap: anywhere; }
  .copy { background: none; border: 0; color: var(--gold); font-family: var(--mono); font-size: 0.66rem; cursor: pointer; padding: 0 0 0 8px; }

  /* chip selector */
  .nav {
    position: fixed; left: 20px; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px;
  }
  .nav::-webkit-scrollbar { display: none; }
  .nav button {
    flex: none; display: flex; gap: 8px; align-items: baseline; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 0.82rem;
  }
  .nav button span { font-family: var(--mono); font-size: 0.66rem; color: var(--gold); }
  .nav button[aria-current="true"] { background: var(--gold); color: #120d05; border-color: var(--gold); }
  .nav button[aria-current="true"] span { color: #120d05; }
  .nav .home { margin-left: auto; }

  @media (max-width: 760px) {
    .brand { top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; }
    .brand h1 { font-size: 1.7rem; }
    .brand .hint { display: none; }
    .panel { top: auto; left: 12px; right: 12px; width: auto; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); height: 46%; }
    .panel-body { padding: 18px 18px 14px; }
    .panel h2 { font-size: 1.4rem; }
    .nav { left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
    .nav .home { margin-left: 0; }
  }
</style>

      u.top.emissiveIntensity = isSel ? 0.05 + 0.03 * Math.sin(t * 2.4) : 0;
    });
    var sm = chipById[selected];
    if (sm) { lightGoal.set(sm.position.x, 6, sm.position.z + 1); focusLight.position.lerp(lightGoal, Math.min(1, dt * 4)); }

    if (composer) composer.render(); else renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
})();
</script>
